name: Verify the lighthouse
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/interactive_storytelling?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interactive_storytelling
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            Server/package-lock.json
            Client/package-lock.json
      - run: npm run setup
      - run: npm --prefix Server run db:migrate
      - run: npx playwright install --with-deps chromium
        working-directory: Client
      - run: npm test
      - run: node scripts/postgres-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: Client/test-results
