name: Verify the lighthouse
on: [push, pull_request]
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/interactive_storytelling?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interactive_storytelling
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            Server/package-lock.json
            Client/package-lock.json
      - run: npm ci
        working-directory: Server
      - run: npm ci
        working-directory: Client
      - run: npm run content:check
        working-directory: Server
      - run: npm --prefix Server run db:migrate
      - run: npx playwright install --with-deps chromium
        working-directory: Client
      - run: npm test
        working-directory: Server
      - run: npm run test:e2e
        working-directory: Server
      - run: npm run test:e2e
        working-directory: Client
      - run: npm run test:postgres
        working-directory: Server
      - name: Validate production compose configuration
        run: docker compose --env-file Server/.env.production.example -f Server/docker-compose.production.yml config --quiet
      - name: Build production API image
        run: docker build -t lighthouse-api:verify Server
      - name: Build production client image
        run: docker build --build-arg NEXT_PUBLIC_SITE_URL=https://story.example.test --build-arg NEXT_PUBLIC_API_URL=https://api.example.test -t lighthouse-client:verify Client
      - name: Verify production containers
        run: node Server/scripts/container-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: Client/test-results
